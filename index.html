<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Screen Share</h2>
            <p>Set your display name for this session</p>
            <input type="text" id="nameInput" placeholder="Enter your name" maxlength="20">
            <div class="modal-buttons">
                <button id="setName" class="btn btn-primary">Set Name</button>
                <button id="skipName" class="btn btn-secondary">Skip</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Screen Share</h1>
            <div class="header-controls">
                <button id="cinemaMode" class="btn btn-secondary">Cinema Mode</button>
            </div>
        </header>

        <div class="main-content">
            <div class="left-section">
                <div class="controls-section">
                    <div class="control-group">
                        <h2>Share Your Screen</h2>
                        <div class="button-group">
                            <button id="startScreenShare" class="btn btn-primary">Start Sharing</button>
                            <button id="stopScreenShare" class="btn btn-danger" style="display:none;">Stop Sharing</button>
                        </div>
                        <div class="id-display">
                            <label>Your ID:</label>
                            <span id="myId" class="peer-id">Connecting...</span>
                        </div>
                        <div class="id-display">
                            <label>Your Name:</label>
                            <span id="displayName" class="peer-id"></span>
                        </div>
                    </div>

                    <div class="control-group">
                        <h2>Watch a Screen</h2>
                        <div class="input-group">
                            <input type="text" id="remoteId" placeholder="Enter host ID">
                            <button id="connect" class="btn btn-secondary">Connect</button>
                        </div>
                    </div>
                </div>

                <div class="video-container">
                    <video id="screenVideo" autoplay playsinline></video>
                    <div class="video-controls">
                        <button id="fullscreenBtn" class="video-control-btn" title="Fullscreen">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                        </button>
                        <button id="exitCinema" class="video-control-btn" style="display:none;">Exit Cinema Mode</button>
                    </div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-header">
                    <h2>Live Chat</h2>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="Type a message...">
                    <button id="sendMessage" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
